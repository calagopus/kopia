name: Build and Release Kopia

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      kopia_version:
        description: "Kopia version to build (e.g., v0.23.1). Leave empty to fetch latest."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  get-version:
    name: Get Kopia Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine Kopia version
        id: version
        run: |
          if [ -n "${{ inputs.kopia_version }}" ]; then
            VERSION="${{ inputs.kopia_version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/kopia/kopia/releases/latest | jq -r .tag_name)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Kopia version: ${VERSION}"

  build-and-push:
    name: Build multi-arch Docker images and push
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x,linux/riscv64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KOPIA_VERSION=${{ needs.get-version.outputs.version }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  export-binaries:
    name: Extract binaries from pushed images and upload artifacts
    needs:
      - get-version
      - build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            output_name: x86_64
          - platform: linux/arm64
            output_name: aarch64
          - platform: linux/arm/v7
            output_name: armv7
          - platform: linux/ppc64le
            output_name: ppc64le
          - platform: linux/s390x
            output_name: s390x
          - platform: linux/riscv64
            output_name: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull platform-specific image
        id: pull
        run: |
          set -eux
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.get-version.outputs.version }}"
          echo "Pulling ${IMAGE} for platform ${{ matrix.platform }}"
          docker pull --platform=${{ matrix.platform }} "${IMAGE}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Create container and copy binaries
        id: extract
        run: |
          set -eux
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.get-version.outputs.version }}"
          OUTDIR="release/${{ matrix.output_name }}"
          mkdir -p "${OUTDIR}"

          CID=$(docker create --platform=${{ matrix.platform }} "${IMAGE}")
          echo "created container ${CID}"

          if docker cp "${CID}:/usr/local/bin/kopia" "${OUTDIR}/kopia-${{ matrix.output_name }}-linux"; then
            chmod +x "${OUTDIR}/kopia-${{ matrix.output_name }}-linux" || true
            echo "Copied kopia binary"
          else
            echo "kopia binary not found in image for platform ${{ matrix.platform }}"
            exit 1
          fi

          docker rm "${CID}" >/dev/null || true
          ls -la "${OUTDIR}" || true
          echo "outdir=${OUTDIR}" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kopia-${{ matrix.output_name }}-linux
          path: release/${{ matrix.output_name }}/*

  create-release:
    name: Create Release
    needs: [get-version, build-and-push, export-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts (all arches)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for arch in x86_64 aarch64 armv7 ppc64le s390x riscv64; do
            if [ -d "artifacts/kopia-${arch}-linux" ]; then
              cp artifacts/kopia-${arch}-linux/* release/ || true
            fi
          done
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: ${{ needs.get-version.outputs.version }}
          body: |
            Built from [kopia/kopia@${{ needs.get-version.outputs.version }}](https://github.com/kopia/kopia/releases/tag/${{ needs.get-version.outputs.version }})
          files: release/*
          draft: false
          prerelease: false
